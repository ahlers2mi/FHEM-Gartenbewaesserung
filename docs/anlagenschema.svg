<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 780" font-family="'Segoe UI',Roboto,Helvetica,Arial,sans-serif" role="img" aria-label="Anlagenschema der FHEM-Gartenbewaesserung: Dachrinne, IBC, Fass, Pumpe und Magnetventile">
  <defs>
    <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8fd3f4"/>
      <stop offset="1" stop-color="#2b8fd0"/>
    </linearGradient>
    <linearGradient id="pipeWater" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5cb6e8"/>
      <stop offset="1" stop-color="#2f8ccb"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f3f9fd"/>
      <stop offset="1" stop-color="#e7f1f8"/>
    </linearGradient>
    <linearGradient id="barrel" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1f5e42"/>
      <stop offset="0.5" stop-color="#37946a"/>
      <stop offset="1" stop-color="#1f5e42"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#183a52" flood-opacity="0.18"/>
    </filter>
    <marker id="aBlue" markerWidth="9" markerHeight="9" refX="6.5" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#2b8fd0"/></marker>
    <marker id="aDark" markerWidth="9" markerHeight="9" refX="6.5" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#37474f"/></marker>
    <marker id="aGrey" markerWidth="9" markerHeight="9" refX="6.5" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#8fa6b4"/></marker>
  </defs>

  <!-- backdrop -->
  <rect x="8" y="8" width="1104" height="764" rx="22" fill="url(#card)" stroke="#cfe0ee" stroke-width="2"/>

  <!-- title -->
  <text x="560" y="48" text-anchor="middle" font-size="28" font-weight="700" fill="#123a52">Gartenbewässerung &#8211; Anlagenschema</text>
  <text x="560" y="74" text-anchor="middle" font-size="14" fill="#4a6b82">Regenwasser-Sammlung &#183; IBC &#183; Fass &#183; Pumpe &#183; Magnetventile</text>

  <!-- ===================== RAIN / WEATHER ===================== -->
  <g>
    <!-- cloud -->
    <g fill="#b9cdda">
      <ellipse cx="150" cy="150" rx="42" ry="26"/>
      <ellipse cx="196" cy="138" rx="34" ry="26"/>
      <ellipse cx="120" cy="140" rx="26" ry="20"/>
      <rect x="118" y="150" width="92" height="18" rx="9"/>
    </g>
    <g stroke="#2b8fd0" stroke-width="3" stroke-linecap="round">
      <line x1="128" y1="176" x2="122" y2="192"/>
      <line x1="152" y1="178" x2="146" y2="196"/>
      <line x1="176" y1="176" x2="170" y2="192"/>
    </g>
    <!-- weather station -->
    <g>
      <line x1="322" y1="112" x2="322" y2="168" stroke="#607d8b" stroke-width="4"/>
      <rect x="308" y="96" width="28" height="18" rx="3" fill="#455a64"/>
      <path d="M308,96 h28 l-6,-9 h-16 Z" fill="#78909c"/>
      <circle cx="322" cy="90" r="3" fill="#e8a33d"/>
      <text x="322" y="186" text-anchor="middle" font-size="11.5" fill="#4a6b82">Wetterstation</text>
      <text x="322" y="200" text-anchor="middle" font-size="11.5" fill="#4a6b82">Regen (mm)</text>
    </g>
  </g>

  <!-- ===================== ROOF + GUTTER + DOWNPIPE ===================== -->
  <g>
    <!-- roof board (sloped) -->
    <polygon points="70,150 300,182 300,198 70,166" fill="#bf6a4c"/>
    <g stroke="#a2573d" stroke-width="1.4">
      <line x1="78" y1="156" x2="300" y2="187"/>
      <line x1="78" y1="162" x2="300" y2="193"/>
    </g>
    <!-- gutter (Dachrinne) -->
    <path d="M250,196 q0,16 14,16 h64 q14,0 14,-16" fill="none" stroke="#9fb3c0" stroke-width="7" stroke-linecap="round"/>
    <text x="300" y="230" text-anchor="middle" font-size="12.5" font-weight="600" fill="#37596e">Dachrinne</text>
    <!-- downpipe (Fallrohr) -->
    <rect x="316" y="204" width="16" height="98" fill="#b7c6d0"/>
    <rect x="319" y="204" width="6" height="98" fill="url(#pipeWater)"/>
    <text x="352" y="258" font-size="11" fill="#4a6b82" transform="rotate(90 352 258)">Fallrohr</text>
    <!-- rain flow label -->
    <text x="118" y="118" font-size="12" font-weight="600" fill="#2b8fd0">Regenwasser</text>
    <line x1="330" y1="300" x2="330" y2="316" stroke="#2b8fd0" stroke-width="3" marker-end="url(#aBlue)"/>
  </g>

  <!-- ===================== IBC ===================== -->
  <g filter="url(#soft)">
    <!-- inlet cap -->
    <rect x="316" y="292" width="30" height="12" rx="2" fill="#8ba0ad"/>
    <!-- tank body -->
    <rect x="210" y="304" width="190" height="182" rx="8" fill="#eef4f7" stroke="#7d94a3" stroke-width="3"/>
    <!-- water fill (~60%) -->
    <rect x="216" y="378" width="178" height="102" rx="4" fill="url(#water)" opacity="0.92"/>
    <line x1="216" y1="382" x2="394" y2="382" stroke="#eaf7ff" stroke-width="2" opacity="0.7"/>
    <!-- cage grid -->
    <g stroke="#9fb3c0" stroke-width="2" fill="none" opacity="0.85">
      <line x1="242" y1="304" x2="242" y2="486"/>
      <line x1="274" y1="304" x2="274" y2="486"/>
      <line x1="306" y1="304" x2="306" y2="486"/>
      <line x1="338" y1="304" x2="338" y2="486"/>
      <line x1="368" y1="304" x2="368" y2="486"/>
      <line x1="210" y1="344" x2="400" y2="344"/>
      <line x1="210" y1="392" x2="400" y2="392"/>
      <line x1="210" y1="440" x2="400" y2="440"/>
    </g>
    <!-- pallet -->
    <rect x="204" y="486" width="202" height="16" rx="2" fill="#b08654"/>
    <rect x="214" y="502" width="18" height="12" fill="#8a663f"/>
    <rect x="296" y="502" width="18" height="12" fill="#8a663f"/>
    <rect x="378" y="502" width="18" height="12" fill="#8a663f"/>
  </g>
  <text x="305" y="336" text-anchor="middle" font-size="15" font-weight="700" fill="#123a52">IBC &#183; 1000 l</text>

  <!-- ===================== FASS (rain barrel) ===================== -->
  <g filter="url(#soft)">
    <path d="M472,360 v150 a75,18 0 0 0 150,0 v-150" fill="url(#barrel)"/>
    <ellipse cx="547" cy="360" rx="75" ry="18" fill="#3ba173"/>
    <ellipse cx="547" cy="360" rx="63" ry="13" fill="#2b7d57"/>
    <!-- hoops -->
    <path d="M472,410 a75,18 0 0 0 150,0" fill="none" stroke="#17452f" stroke-width="2" opacity="0.5"/>
    <path d="M472,460 a75,18 0 0 0 150,0" fill="none" stroke="#17452f" stroke-width="2" opacity="0.5"/>
    <!-- level gauge (water window) -->
    <rect x="536" y="372" width="22" height="140" rx="6" fill="#0d3325" opacity="0.35"/>
    <rect x="539" y="424" width="16" height="85" rx="4" fill="url(#water)"/>
    <line x1="539" y1="428" x2="555" y2="428" stroke="#eaf7ff" stroke-width="2" opacity="0.7"/>
  </g>
  <text x="547" y="548" text-anchor="middle" font-size="15" font-weight="700" fill="#123a52">Fass</text>
  <text x="547" y="564" text-anchor="middle" font-size="11.5" fill="#4a6b82">Regentonne</text>

  <!-- ===================== IBC -> FASS (gravity) ===================== -->
  <g>
    <rect x="400" y="434" width="72" height="12" fill="#b7c6d0"/>
    <rect x="400" y="437" width="72" height="6" fill="url(#pipeWater)"/>
    <!-- gate valve V5 -->
    <g transform="translate(436,440)">
      <path d="M-11,-11 L11,11 M11,-11 L-11,11" stroke="#c8822b" stroke-width="0" />
      <path d="M-12,-12 L0,0 L-12,12 Z" fill="#e8a33d" stroke="#b8781f" stroke-width="1.5"/>
      <path d="M12,-12 L0,0 L12,12 Z" fill="#e8a33d" stroke="#b8781f" stroke-width="1.5"/>
      <rect x="-4" y="-20" width="8" height="9" rx="2" fill="#8a5a12"/>
    </g>
    <line x1="404" y1="452" x2="468" y2="452" stroke="#2b8fd0" stroke-width="2.5" marker-end="url(#aBlue)"/>
    <text x="436" y="480" text-anchor="middle" font-size="10.5" fill="#4a6b82">V5 &#183; IBC&#8594;Fass</text>
    <text x="436" y="493" text-anchor="middle" font-size="10.5" fill="#4a6b82">(Schwerkraft)</text>
  </g>

  <!-- ===================== PUMP ===================== -->
  <g>
    <!-- suction from barrel -->
    <rect x="540" y="510" width="14" height="52" fill="#b7c6d0"/>
    <rect x="543" y="510" width="6" height="52" fill="url(#pipeWater)"/>
    <g filter="url(#soft)">
      <rect x="500" y="566" width="46" height="40" rx="6" fill="#455a64"/>
      <circle cx="566" cy="586" r="30" fill="#37474f"/>
      <circle cx="566" cy="586" r="20" fill="#eef4f7"/>
      <path d="M566,586 L566,568 M566,586 L582,596 M566,586 L550,596" stroke="#607d8b" stroke-width="4" stroke-linecap="round"/>
      <circle cx="566" cy="586" r="4" fill="#37474f"/>
      <rect x="498" y="606" width="94" height="8" rx="3" fill="#e8a33d"/>
    </g>
    <text x="546" y="634" text-anchor="middle" font-size="13" font-weight="700" fill="#123a52">Pumpe</text>
  </g>

  <!-- ===================== FASS -> IBC return (ibcFill, when raining) ===================== -->
  <g>
    <path d="M512,590 C420,600 420,300 372,300" fill="none" stroke="#2b8fd0" stroke-width="2.5" stroke-dasharray="1 0" marker-end="url(#aBlue)" opacity="0.85"/>
    <g transform="translate(414,392)">
      <path d="M-11,-11 L0,0 L-11,11 Z" fill="#e8a33d" stroke="#b8781f" stroke-width="1.5"/>
      <path d="M11,-11 L0,0 L11,11 Z" fill="#e8a33d" stroke="#b8781f" stroke-width="1.5"/>
      <rect x="-4" y="-20" width="8" height="9" rx="2" fill="#8a5a12"/>
    </g>
    <text x="414" y="368" text-anchor="middle" font-size="10.5" fill="#2b8fd0">V6 &#183; Fass&#8594;IBC</text>
    <text x="414" y="356" text-anchor="middle" font-size="10.5" fill="#2b8fd0">(bei Regen)</text>
  </g>

  <!-- ===================== MANIFOLD + MAGNETVENTILE ===================== -->
  <g>
    <!-- pressure line pump -> header -->
    <path d="M596,586 H700" fill="none" stroke="#37474f" stroke-width="7" stroke-linecap="round"/>
    <!-- header (vertical) -->
    <rect x="694" y="430" width="12" height="160" rx="6" fill="#37474f"/>
    <text x="700" y="418" text-anchor="middle" font-size="12.5" font-weight="700" fill="#123a52">Magnetventile (bis 8)</text>

    <!-- valve rows -->
    <!-- row helper: valve body + branch + label -->
    <g font-size="12" fill="#123a52">
      <!-- V1 Magnolie -->
      <line x1="706" y1="446" x2="742" y2="446" stroke="#37474f" stroke-width="6"/>
      <rect x="742" y="436" width="30" height="20" rx="4" fill="#e8a33d" stroke="#b8781f" stroke-width="1.5"/>
      <rect x="753" y="428" width="8" height="9" rx="2" fill="#8a5a12"/>
      <path d="M772,446 H840" stroke="#37474f" stroke-width="4" marker-end="url(#aDark)"/>
      <text x="782" y="440" font-size="11.5" fill="#37596e">V1</text>
    </g>
    <g font-size="12">
      <line x1="706" y1="484" x2="742" y2="484" stroke="#37474f" stroke-width="6"/>
      <rect x="742" y="474" width="30" height="20" rx="4" fill="#e8a33d" stroke="#b8781f" stroke-width="1.5"/>
      <rect x="753" y="466" width="8" height="9" rx="2" fill="#8a5a12"/>
      <path d="M772,484 H840" stroke="#37474f" stroke-width="4" marker-end="url(#aDark)"/>
      <text x="782" y="478" font-size="11.5" fill="#37596e">V2</text>
    </g>
    <g font-size="12">
      <line x1="706" y1="522" x2="742" y2="522" stroke="#37474f" stroke-width="6"/>
      <rect x="742" y="512" width="30" height="20" rx="4" fill="#e8a33d" stroke="#b8781f" stroke-width="1.5"/>
      <rect x="753" y="504" width="8" height="9" rx="2" fill="#8a5a12"/>
      <path d="M772,522 H840" stroke="#37474f" stroke-width="4" marker-end="url(#aDark)"/>
      <text x="782" y="516" font-size="11.5" fill="#37596e">V3</text>
    </g>
    <g font-size="12">
      <line x1="706" y1="560" x2="742" y2="560" stroke="#37474f" stroke-width="6"/>
      <rect x="742" y="550" width="30" height="20" rx="4" fill="#e8a33d" stroke="#b8781f" stroke-width="1.5"/>
      <rect x="753" y="542" width="8" height="9" rx="2" fill="#8a5a12"/>
      <path d="M772,560 H840" stroke="#37474f" stroke-width="4" marker-end="url(#aDark)"/>
      <text x="782" y="554" font-size="11.5" fill="#37596e">V8</text>
    </g>
  </g>

  <!-- ===================== ZONES ===================== -->
  <g>
    <!-- Magnolie (tree) -->
    <g transform="translate(864,430)">
      <rect x="14" y="16" width="6" height="14" fill="#7a5230"/>
      <circle cx="17" cy="10" r="12" fill="#5aa469"/>
      <circle cx="9" cy="14" r="7" fill="#6cb87a"/>
      <circle cx="25" cy="14" r="7" fill="#6cb87a"/>
      <text x="42" y="24" font-size="12.5" font-weight="600" fill="#123a52">Magnolie</text>
    </g>
    <!-- Weg Anbau (path/bed) -->
    <g transform="translate(864,470)">
      <path d="M6,26 L18,2 L26,2 L14,26 Z" fill="#cdb48c"/>
      <circle cx="30" cy="10" r="3.5" fill="#5aa469"/>
      <circle cx="34" cy="18" r="3.5" fill="#5aa469"/>
      <text x="46" y="20" font-size="12.5" font-weight="600" fill="#123a52">Weg Anbau</text>
    </g>
    <!-- Pool -->
    <g transform="translate(864,506)">
      <rect x="4" y="6" width="34" height="20" rx="5" fill="#37a9e0"/>
      <path d="M8,16 q4,-4 8,0 t8,0 t8,0" fill="none" stroke="#eaf7ff" stroke-width="2"/>
      <text x="46" y="22" font-size="12.5" font-weight="600" fill="#123a52">Pool</text>
    </g>
    <!-- Gewaechshaus -->
    <g transform="translate(864,544)">
      <path d="M6,26 V10 L22,2 L38,10 V26 Z" fill="#dbe9f1" stroke="#8fb2c7" stroke-width="1.5"/>
      <path d="M6,10 L22,2 L38,10" fill="none" stroke="#8fb2c7" stroke-width="1.5"/>
      <line x1="22" y1="2" x2="22" y2="26" stroke="#8fb2c7" stroke-width="1"/>
      <line x1="14" y1="6" x2="14" y2="26" stroke="#8fb2c7" stroke-width="1"/>
      <line x1="30" y1="6" x2="30" y2="26" stroke="#8fb2c7" stroke-width="1"/>
      <text x="46" y="22" font-size="12.5" font-weight="600" fill="#123a52">Gewächshaus</text>
    </g>
    <text x="864" y="596" font-size="11.5" fill="#6b8497">&#8230; V4&#8211;V7 weitere Kreise</text>
  </g>

  <!-- ===================== HAUSWASSER (reserve) ===================== -->
  <g>
    <g transform="translate(452,632)">
      <rect x="-6" y="0" width="30" height="10" rx="3" fill="#8fa6b4"/>
      <rect x="20" y="-14" width="8" height="18" fill="#8fa6b4"/>
      <path d="M24,-14 q10,0 10,10" fill="none" stroke="#8fa6b4" stroke-width="6"/>
    </g>
    <path d="M470,628 C500,600 512,560 528,522" fill="none" stroke="#8fa6b4" stroke-width="2.5" stroke-dasharray="6 5" marker-end="url(#aGrey)"/>
    <text x="452" y="662" text-anchor="middle" font-size="11" fill="#6b8497">Hauswasser (Reserve)</text>
  </g>

  <!-- ===================== SENSORS ===================== -->
  <g font-size="11">
    <!-- IBC sensors -->
    <g transform="translate(96,322)"><rect width="98" height="22" rx="11" fill="#fff" stroke="#3aa17e" stroke-width="1.5"/><circle cx="13" cy="11" r="5" fill="#3aa17e"/><text x="24" y="15" fill="#1f5e42">ibcFull</text></g>
    <line x1="194" y1="333" x2="212" y2="330" stroke="#3aa17e" stroke-width="1.5"/>
    <g transform="translate(96,454)"><rect width="106" height="22" rx="11" fill="#fff" stroke="#c94f4f" stroke-width="1.5"/><circle cx="13" cy="11" r="5" fill="#c94f4f"/><text x="24" y="15" fill="#8a2f2f">ibcEmpty</text></g>
    <line x1="202" y1="465" x2="214" y2="470" stroke="#c94f4f" stroke-width="1.5"/>
    <!-- Fass sensors -->
    <g transform="translate(632,352)"><rect width="118" height="22" rx="11" fill="#fff" stroke="#3aa17e" stroke-width="1.5"/><circle cx="13" cy="11" r="5" fill="#3aa17e"/><text x="24" y="15" fill="#1f5e42">barrelFull</text></g>
    <line x1="624" y1="372" x2="632" y2="363" stroke="#3aa17e" stroke-width="1.5"/>
    <g transform="translate(632,486)"><rect width="128" height="22" rx="11" fill="#fff" stroke="#c94f4f" stroke-width="1.5"/><circle cx="13" cy="11" r="5" fill="#c94f4f"/><text x="24" y="15" fill="#8a2f2f">barrelEmpty</text></g>
    <line x1="620" y1="486" x2="626" y2="497" stroke="#c94f4f" stroke-width="1.5"/>
  </g>

  <!-- ===================== LEGEND ===================== -->
  <g transform="translate(40,712)" font-size="12" fill="#37596e">
    <rect x="0" y="0" width="1040" height="48" rx="12" fill="#ffffff" stroke="#d8e6f0" stroke-width="1.5"/>
    <g transform="translate(22,24)">
      <line x1="0" y1="0" x2="34" y2="0" stroke="#2b8fd0" stroke-width="4" marker-end="url(#aBlue)"/>
      <text x="44" y="4">Regenwasser-Sammlung</text>
    </g>
    <g transform="translate(260,24)">
      <line x1="0" y1="0" x2="34" y2="0" stroke="#37474f" stroke-width="4" marker-end="url(#aDark)"/>
      <text x="44" y="4">Bewässerung (Pumpe &#8594; Ventile)</text>
    </g>
    <g transform="translate(560,24)">
      <line x1="0" y1="0" x2="34" y2="0" stroke="#8fa6b4" stroke-width="3" stroke-dasharray="6 5" marker-end="url(#aGrey)"/>
      <text x="44" y="4">Hauswasser (Reserve)</text>
    </g>
    <g transform="translate(792,24)">
      <circle cx="8" cy="-1" r="6" fill="#fff" stroke="#3aa17e" stroke-width="1.5"/>
      <circle cx="8" cy="-1" r="3" fill="#3aa17e"/>
      <text x="24" y="4">Sensor (Füllstand / Regen)</text>
    </g>
  </g>
</svg>
